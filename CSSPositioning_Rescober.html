<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>
    <style>
        .relative {
            position: relative;
            left: 30px;
            background: lightgreen;
            padding: 10px;
        }
        .absolute {
            position: absolute;
            top: 50px;
            left: 50px;
            background: pink;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="relative">Relative Position</div>
<div class="absolute">Absolute Position</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Responsive Layout</title>
    <style>
        body {
            font-family: Arial;
        }
        .box {
            padding: 20px;
            background: lightblue;
        }

        @media (max-width: 600px) {
            .box {
                background: orange;
            }
        }
    </style>
</head>
<body>

<div class="box">Resize the screen to see effect</div>

</body>
</html>
